name: Pricing UI Preview

on:
  push:
    branches:
      - fix/dashboard-account-pricing-launch

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://coiprfontulttcjhnhlp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_8siBjVnKH4ikPgI2E49c0g_9IhjbTJY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Build application
        run: npm run build
      - name: Start local Next.js server
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/brandbox-next.log 2>&1 &
          echo $! > /tmp/brandbox-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/pricing >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/brandbox-next.log
          exit 1
      - name: Capture real pricing page
        run: |
          mkdir -p local-preview
          node - <<'NODE'
          const { chromium } = require('playwright');
          async function capture(viewport, path) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport });
            await page.goto('http://127.0.0.1:3000/pricing', { waitUntil: 'networkidle' });
            await page.getByText('الباقات الشهرية', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('الاحترافية', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(500);
            await page.screenshot({ path, fullPage: false });
            await browser.close();
          }
          (async () => {
            await capture({ width: 1440, height: 1200 }, 'local-preview/pricing-desktop.png');
            await capture({ width: 390, height: 844 }, 'local-preview/pricing-mobile.png');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload pricing previews
        uses: actions/upload-artifact@v4
        with:
          name: brandbox-pricing-ui-preview
          path: local-preview/*.png
          if-no-files-found: error
          retention-days: 7
