name: mobile-ci

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'src/app/api/v1/mobile/**'
      - 'src/app/api/v1/social/**'
      - 'src/app/api/internal/social/**'
      - 'src/lib/social/**'
      - 'src/app/api/v1/trends/**'
      - 'src/tests/mobile-*.guard.cjs'
      - 'supabase/migrations/**'
      - '.env.example'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'feat/mobile-*'
    paths:
      - 'apps/mobile/**'
      - 'src/app/api/v1/mobile/**'
      - 'src/app/api/v1/social/**'
      - 'src/app/api/internal/social/**'
      - 'src/lib/social/**'
      - 'src/app/api/v1/trends/**'
      - 'src/tests/mobile-*.guard.cjs'
      - 'supabase/migrations/**'
      - '.env.example'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json
      - name: Install mobile dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck mobile app
        run: npm run typecheck
      - name: Campaign Composer security guard
        run: node ../../src/tests/mobile-campaign-composer.guard.cjs
      - name: Social OAuth security guard
        run: node ../../src/tests/mobile-social-oauth.guard.cjs
      - name: Social lifecycle security guard
        run: node ../../src/tests/mobile-social-lifecycle.guard.cjs
      - name: Social scheduler security guard
        run: node ../../src/tests/mobile-social-scheduler.guard.cjs
      - name: Mobile product QA guard
        run: node ../../src/tests/mobile-product-qa.guard.cjs
      - name: Social draft review guard
        run: node ../../src/tests/mobile-social-draft-review.guard.cjs
      - name: Project workspace guard
        run: node ../../src/tests/mobile-project-workspace.guard.cjs
