name: OpenRouter Video Production

on:
  pull_request:
    paths:
      - 'src/lib/ai/openrouter-video-client.ts'
      - 'src/lib/generations/openrouter-video-generation-service.ts'
      - 'src/app/api/v1/openrouter-video-generations/**'
      - 'src/components/OpenRouterVideoProjectWorkspace.jsx'
      - 'src/app/projects/video/workspace/page.jsx'
      - 'src/tests/openrouter-video-production.test.ts'
      - 'supabase/migrations/20260905204500_add_verified_seedance_20_mini_video_model.sql'
      - '.github/workflows/openrouter-video-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: OpenRouter video production guard
        run: node --import tsx src/tests/openrouter-video-production.test.ts
      - name: Existing regression suite
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
