name: Release v1 verification

on:
  push:
    branches:
      - release/v1.0.0-production
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed on release branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore(release): commit npm lockfile"
            git push
          fi
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
