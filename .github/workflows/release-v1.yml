name: Release v1 verification

on:
  push:
    branches:
      - main
      - release/v1.0.0-production
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed on release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1.0.0-production'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore(release): commit npm lockfile"
            git push
          fi
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Store regression suite
        run: |
          npm run test:store-v1
          npm run test:admin-store
          npm run test:store-refunds
          npm run test:store-admin-catalog
          npm run test:store-providers
          npm run test:store-payment-return
          npm run test:store-finance
          npm run test:store-readiness
          npm run test:store-inventory
          npm run test:store-code-delivery
          npm run test:store-code-recovery
          npm run test:store-delivery
          npm run test:store-inventory-admin
          npm run test:store-stock-guard
          npm run test:store-launch-readiness
          npm run test:store-db-performance
          npm run test:store-purchases-redaction
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
