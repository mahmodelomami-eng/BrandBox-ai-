name: RC OpenRouter Preview Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'launch/97-openrouter-runtime-probe'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for Vercel preview and verify redacted provider readiness
        shell: bash
        run: |
          set -euo pipefail
          url='https://brand-box-ai-git-launch-97-openrouter-runtime-probe-brand21.vercel.app/api/health/openrouter'
          body=''
          code='000'
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location --output /tmp/openrouter-readiness.json --write-out '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ]; then
              body="$(cat /tmp/openrouter-readiness.json)"
              break
            fi
            sleep 10
          done

          if [ "$code" != '200' ]; then
            echo "Preview readiness endpoint was not reachable with HTTP 200 (last status: $code)."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/openrouter-readiness.json', 'utf8'));
          const readiness = data && data.openrouter;
          const safe = {
            status: data?.status,
            configured: Boolean(readiness?.configured),
            authenticated: Boolean(readiness?.authenticated),
            imageCatalogAvailable: Boolean(readiness?.imageCatalogAvailable),
            videoCatalogAvailable: Boolean(readiness?.videoCatalogAvailable),
          };
          console.log(JSON.stringify(safe));
          if (!safe.configured || !safe.authenticated || !safe.imageCatalogAvailable || !safe.videoCatalogAvailable) {
            process.exit(1);
          }
          NODE
